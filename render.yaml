# Render Blueprint — API + web only (free). The database is a free external
# Postgres (Neon), so Render does not require a card.
#
# In Render: New + → "Blueprint" → connect this repo → Apply. During/after the
# first deploy, set these env vars in the Render dashboard:
#   - fintrackpro-api → DATABASE_URL            = your Neon connection string
#   - fintrackpro-api → CORS_ORIGIN             = your web URL (after deploy)
#   - fintrackpro-web → EXPO_PUBLIC_API_BASE_URL = your API URL (then redeploy web)

services:
  # --- API (Node + Express, built from server/Dockerfile) ---
  - type: web
    name: fintrackpro-api
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false # paste your Neon connection string here
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true # Render generates a strong secret
      - key: PORT
        value: "4000"
      - key: CORS_ORIGIN
        sync: false # set to your web app URL after first deploy

  # --- Web app (Expo web static export) ---
  - type: web
    name: fintrackpro-web
    runtime: static
    buildCommand: npm install --legacy-peer-deps --no-audit --no-fund && npx expo export -p web
    staticPublishPath: ./dist
    envVars:
      - key: EXPO_PUBLIC_API_BASE_URL
        sync: false # set to your API URL, then redeploy this service
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
