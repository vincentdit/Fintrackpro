# Render Blueprint — deploys the whole FinTrackPro stack from this repo.
# In Render: New + → "Blueprint" → connect this GitHub repo. Render reads this
# file and creates the database, the API, and the web app.
#
# After the first deploy, set the two "sync: false" env vars (they can't be
# known ahead of time) in the Render dashboard:
#   - fintrackpro-api  → CORS_ORIGIN            = your web URL (below)
#   - fintrackpro-web  → EXPO_PUBLIC_API_BASE_URL = your API URL
# then trigger a redeploy of the web service so the URL is baked into the build.

databases:
  - name: fintrackpro-db
    databaseName: fintrack
    user: fintrack

services:
  # --- API (Node + Express, built from server/Dockerfile) ---
  - type: web
    name: fintrackpro-api
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fintrackpro-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true # Render generates a strong secret
      - key: PORT
        value: "4000"
      - key: CORS_ORIGIN
        sync: false # set to your web app URL after first deploy

  # --- Web app (Expo web static export) ---
  - type: web
    name: fintrackpro-web
    runtime: static
    buildCommand: npm install --legacy-peer-deps --no-audit --no-fund && npx expo export -p web
    staticPublishPath: ./dist
    envVars:
      - key: EXPO_PUBLIC_API_BASE_URL
        sync: false # set to your API URL, then redeploy this service
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
